# Tests nanoterm on every push and pull request: on macOS, on Linux under a
# virtual display, and on Windows (pipes, pseudo consoles and PowerShell,
# which Wine can't stand in for).
name: CI

on:
  push:
    branches: [main, windows]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test

  # In a plain Ubuntu, as tools/linux.Dockerfile has it: the runner's own
  # image adds to zsh's start-up, and the tests drive a real zsh.
  linux:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: GTK, fonts, the shells and tools the tests run, a virtual display
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-3-0t64 fonts-dejavu-core fonts-noto-core xvfb xauth zsh vim less python3 git curl ca-certificates xz-utils
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test-bin --prefix zig-out/linux
      - run: xvfb-run -a zig-out/linux/bin/nanoterm-tests

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Tests write their pictures to /tmp: on Windows, \tmp on this drive.
      - run: New-Item -ItemType Directory -Force -Path \tmp | Out-Null
      - run: zig build test-bin --prefix zig-out/windows
      # Run directly, each test named as it starts: one that hangs shows.
      - run: zig-out/windows/bin/nanoterm-tests.exe
      # The app itself, without a window: past onboarding, two commands in
      # PowerShell, each a block; the picture is kept with the run. (Piped,
      # so PowerShell waits for it: it's a windowed program.)
      - name: nanoterm, headless, running commands
        run: |
          $dir = "$env:USERPROFILE\Library\Application Support\nanoterm"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          '{"onboarded": true, "agents": false}' | Set-Content "$dir\settings.json"
          zig build --prefix zig-out/windows
          zig-out/windows/bin/nanoterm.exe "--nanoui-snapshot=$env:RUNNER_TEMP\nanoterm-windows.png" "--nanoui-script=live:10;type:echo hello from Windows;key:enter;live:5;type:ls C:\Windows\Web;key:enter;live:6" | Out-Null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanoterm-windows
          path: ${{ runner.temp }}/nanoterm-windows.png
      # Updates on Windows, end to end: a 0.0.1 build finds 0.0.2 in a feed
      # of the release's files, checks and stages it while it runs, and
      # installs it in its own place as it quits.
      - name: An update installs itself
        run: |
          $feed = "$env:RUNNER_TEMP\feed"
          New-Item -ItemType Directory -Force -Path "$feed\nanoterm-0.0.2-windows-x86_64" | Out-Null
          zig build -Dversion=0.0.2 --prefix zig-out/new
          Copy-Item zig-out/new/bin/nanoterm.exe "$feed\nanoterm-0.0.2-windows-x86_64\"
          Compress-Archive -Path "$feed\nanoterm-0.0.2-windows-x86_64" -DestinationPath "$feed\nanoterm-windows-x86_64.zip"
          $sum = (Get-FileHash "$feed\nanoterm-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower()
          "{""version"":""0.0.2"",""files"":{""nanoterm-windows-x86_64.zip"":{""sha256"":""$sum""}}}" | Set-Content -NoNewline "$feed\manifest.json"
          zig build -Dversion=0.0.1 --prefix zig-out/old
          zig-out/old/bin/nanoterm.exe --version | Write-Output
          $env:NANOUI_UPDATE_FEED = "file:///" + ($feed -replace '\\','/')
          zig-out/old/bin/nanoterm.exe "--nanoui-snapshot=$env:RUNNER_TEMP\update.png" --nanoui-wait=45 | Out-Null
          $v = (zig-out/old/bin/nanoterm.exe --version | Out-String).Trim()
          Write-Output "after: $v"
          if ($v -ne "nanoterm 0.0.2") { throw "not updated: $v" }
