# Tests nanoterm on every push and pull request: on macOS, on Linux under a
# virtual display, and on Windows (pipes, pseudo consoles and PowerShell,
# which Wine can't stand in for).
name: CI

on:
  push:
    branches: [main, windows]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test

  # In a plain Ubuntu, as tools/linux.Dockerfile has it: the runner's own
  # image adds to zsh's start-up, and the tests drive a real zsh.
  linux:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: GTK, fonts, the shells and tools the tests run, a virtual display
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-3-0t64 fonts-dejavu-core fonts-noto-core xvfb xauth zsh vim less python3 git curl ca-certificates xz-utils
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test-bin --prefix zig-out/linux
      - run: xvfb-run -a zig-out/linux/bin/nanoterm-tests

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Tests write their pictures to /tmp: on Windows, \tmp on this drive.
      - run: New-Item -ItemType Directory -Force -Path \tmp | Out-Null
      - run: zig build test-bin --prefix zig-out/windows
      # Run directly, each test named as it starts: one that hangs shows.
      - run: zig-out/windows/bin/nanoterm-tests.exe
